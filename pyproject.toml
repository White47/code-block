[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-module-visualizer"
version = "0.1.0"
description = "Python-first code module visualization and program understanding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codeviz = "codeviz.ui.desktop:main"
codeviz-tk = "codeviz.ui.tkapp:main"

[project.optional-dependencies]
# Audited acquisition closure; SDK availability does not open the dispatch gate.
# Hash-locked offline install: requirements/assistant-probe-lock.txt.
ai = [
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "genai-prices==0.1.10",
    "griffelib==2.3.2",
    "h11==0.16.0",
    "httpcore2==2.13.1",
    "httpx2==2.13.1",
    "idna==3.20",
    "jiter==0.17.0",
    "logfire-api==5.1.1",
    "openai==3.29.0",
    "opentelemetry-api==1.45.1",
    "pydantic==2.14.1",
    "pydantic-ai-slim[openai]==2.55.0",
    "pydantic-core==2.50.1",
    "pydantic-graph==2.55.0",
    "regex==2026.9.29",
    "requests==2.34.2",
    "sniffio==1.3.1",
    "tiktoken==0.14.0",
    "truststore==0.10.4",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.8.0",
]
desktop = ["pywebview==6.2.1", "pythonnet==3.2.0; sys_platform == 'win32'"]
packaging = [
    "pyinstaller==6.22.3",
    "setuptools==84.0.0",
]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
extend-exclude = ["tests/fixtures"] # Includes intentionally invalid Python source.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/codeviz"]
strict = true
show_error_codes = true
warn_unused_configs = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
scripts = "scripts"

[tool.setuptools.cmdclass]
build_py = "scripts.desktop_entry.BuildFrontendAssets"

[tool.setuptools.package-data]
"codeviz.ui" = ["assets/**/*", "assets/*"]
