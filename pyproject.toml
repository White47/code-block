[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-module-visualizer"
version = "0.1.0"
description = "Python-first code module visualization and program understanding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.13,<1",
    "mypy>=1.18,<3",
]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/codeviz"]
strict = true
show_error_codes = true
warn_unused_configs = true

[tool.setuptools.packages.find]
where = ["src"]
