[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-module-visualizer"
version = "0.1.0"
description = "Python-first code module visualization and program understanding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codeviz = "codeviz.ui.desktop:main"
codeviz-tk = "codeviz.ui.tkapp:main"

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
packaging = [
    "pyinstaller==6.22.3",
    "setuptools==84.0.0",
]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
extend-exclude = ["tests/fixtures"] # Includes intentionally invalid Python source.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/codeviz"]
strict = true
show_error_codes = true
warn_unused_configs = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
scripts = "scripts"

[tool.setuptools.cmdclass]
build_py = "scripts.desktop_entry.BuildFrontendAssets"

[tool.setuptools.package-data]
"codeviz.ui" = ["assets/**/*", "assets/*"]
