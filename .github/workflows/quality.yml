name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test -- --run
      - run: npm --prefix frontend run build

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Typecheck
        run: python -m mypy

      - name: Test
        run: python -B -m unittest discover -s tests -v

      - name: Set up Node for wheel assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for wheel
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

      - name: Verify wheel assets and optional desktop dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from email.parser import Parser
          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              names = wheel.namelist()
              assert 'codeviz/ui/assets/index.html' in names
              assert any(n.startswith('codeviz/ui/assets/assets/') for n in names)
              metadata = Parser().parsestr(wheel.read(next(n for n in names if n.endswith('/METADATA'))).decode())
              assert all('extra ==' in requirement for requirement in metadata.get_all('Requires-Dist', []))
          PY

      - name: Upload verified Python wheel
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodeViz-wheel-Python-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  windows-packaging:
    name: Windows desktop packaging (no GUI)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install optional AI, desktop and pinned packaging tools
        run: python -m pip install -e ".[ai,desktop,packaging]"
      - name: Create isolated SDK contract environment
        shell: pwsh
        run: |
          python -m venv build/assistant-sdk-probe-20261012
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/assistant-sdk-probe-20261012/Scripts/python.exe -m pip install -e ".[ai]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test actual SDK adapter offline
        shell: pwsh
        run: |
          & ./build/assistant-sdk-probe-20261012/Scripts/python.exe -B -m unittest discover -s tests -p test_assistant_sdk_provider.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build onedir bundle without launching GUI
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -Python (Get-Command python).Source
      - name: Check prerequisites and bundled files without launching GUI
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -CheckOnly -Python (Get-Command python).Source
      - name: Upload complete Windows desktop bundle
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodeViz-Windows-x64
          path: dist/CodeViz/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
